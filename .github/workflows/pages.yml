# Build the Pandoc + Tufte CSS site and publish to the gh-pages branch.
# GitHub Pages source: Settings → Pages → Deploy from a branch → gh-pages / (root).
# This avoids actions/deploy-pages, which returns 404 until "GitHub Actions" Pages is enabled.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.6"

      - name: Build site
        run: bash website/build.sh

      - name: Push site to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/dist
          branch: gh-pages
          clean: true
