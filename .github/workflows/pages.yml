# Quarto Tufte HTML book → GitHub Pages (artifact deploy).
#
# One-time repo setup (required or deploy-pages returns 404):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#   (Do not use “Deploy from a branch” for this workflow.)
#
# Reference: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Pandoc (for LaTeX → Markdown in quarto_gen)
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.6"

      # Quarto resolves book chapter paths before pre-render; ensure .qmd exist first.
      - name: Generate chapter sources
        run: python3 website/quarto_gen.py

      - name: Build site
        run: quarto render

      - name: Disable Jekyll on Pages (underscore paths / Quarto output)
        run: test -f _book/.nojekyll || touch _book/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
