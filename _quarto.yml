project:
  type: tufte
  output-dir: _book
  pre-render:
    - python3 website/quarto_gen.py
  post-render:
    - python3 website/html_fig_img_alt.py
  resources:
    - cover.png
    - website/fonts/**
    - figures/**
    # GitHub Pages runs Jekyll on gh-pages by default; paths with leading underscores can be
    # mishandled. This file disables Jekyll so the full Quarto output (including search data) is published.
    - .nojekyll

book:
  title: "Structural Bioinformatics"
  author: ""
  cover-image: cover.png
  site-url: https://muhammadhasyim.github.io/structural-bio-book/
  repo-url: https://github.com/muhammadhasyim/structural-bio-book
  page-navigation: true
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - ch01_foundations.qmd
        - ch02_data_quality.qmd
    - part: "Sequence Analysis"
      chapters:
        - ch03_pairwise_alignment.qmd
        - ch04_profile_hmm.qmd
        - ch05_classification.qmd
    - part: "Structure Prediction"
      chapters:
        - ch06_homology_modeling.qmd
        - ch07_alphafold.qmd
        - ch08_alphafill.qmd
    - part: "Interactions and Dynamics"
      chapters:
        - ch09_docking.qmd
        - ch10_molecular_dynamics.qmd
    - part: "Special Topics"
      chapters:
        - ch11_disorder.qmd
        - ch12_drug_design.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    fig-cap-location: margin
    css: website/quarto-tufte-overrides.css
    include-in-header:
      - file: website/mathjax-config.html
