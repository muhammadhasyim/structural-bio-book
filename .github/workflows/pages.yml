# Build the Quarto Tufte HTML book and publish to the gh-pages branch.
# GitHub Pages source: Settings → Pages → Deploy from a branch → gh-pages / (root).
# This avoids actions/deploy-pages, which returns 404 until "GitHub Actions" Pages is enabled.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Pandoc (for LaTeX → Markdown in quarto_gen)
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.6"

      # Quarto 4 resolves book chapter paths before project pre-render runs, so
      # gitignored quarto/_generated/*.qmd must exist before `quarto render`.
      - name: Generate chapter sources
        run: python3 website/quarto_gen.py

      - name: Build site
        run: quarto render

      - name: Disable Jekyll on Pages (underscore paths like quarto/_generated/)
        run: test -f _book/.nojekyll || touch _book/.nojekyll

      - name: Push site to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _book
          branch: gh-pages
          clean: true
