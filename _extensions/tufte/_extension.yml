title: Tufte Quarto
author: Fred Guth
version: 1.1.0
quarto-version: ">=1.2.215"
contributes:
  project:
    project:
      type: book
      output-dir: docs
    format:
      html:
        page-layout: full
        reference-location: margin
        citation-location: block
        title-block-style: none
        css: styles.css
        number-sections: false
        linkcolor: Maroon
        backgroundcolor: FloralWhite
        sidebarbackgroundcolor: FloralWhite
        mainfont: "TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, URW Palladio L, Georgia, serif"
        sansfont: "Helvetica Neue, Helvetica, Arial, sans-serif"
        monofont: "ui-monospace, Menlo, Consolas, monospace"
        toc-location: left
        toc-title: "Contents"
        default-image-extension: svg
